<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070b18">
    <meta name="description" content="NuvioTR Android TV uygulaması hakkında bilgiler.">
    <title>NuvioTR Android TV Uygulaması</title>
    <style>
      :root { --bg: #070b18; --text: #f6f8ff; --muted: #a8b2ce; --line: rgba(180, 198, 255, .15) }
      * { box-sizing: border-box }
      body { min-width: 320px; min-height: 100vh; margin: 0; color: var(--text); background: radial-gradient(circle at 18% -5%, rgba(103, 77, 212, .34), transparent 32rem), radial-gradient(circle at 88% 16%, rgba(26, 165, 209, .19), transparent 29rem), var(--bg); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif }
      main { width: min(760px, calc(100% - 40px)); margin: auto; padding: 25px 0 72px }
      .brand { display: inline-flex; gap: 11px; align-items: center; color: var(--text); font-size: 1.15rem; font-weight: 800; letter-spacing: -.04em; text-decoration: none }
      .brand-mark { display: grid; place-items: center; width: 31px; height: 31px; overflow: hidden; border-radius: 10px; background: #fff; box-shadow: 0 5px 20px rgba(53, 217, 255, .25) }
      .brand-mark img { width: 100%; height: 100%; object-fit: contain }
      section { margin-top: 80px; padding: clamp(25px, 6vw, 52px); border: 1px solid var(--line); border-radius: 20px; background: linear-gradient(145deg, rgba(27, 38, 68, .94), rgba(13, 19, 36, .95)); box-shadow: 0 22px 55px rgba(0, 0, 0, .22) }
      .eyebrow { display: inline-flex; align-items: center; gap: 8px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 100px; color: #c8d0e8; background: rgba(17, 24, 44, .55); font-size: .78rem; font-weight: 650 }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: #65e9ad; box-shadow: 0 0 0 5px rgba(101, 233, 173, .13) }
      h1 { margin: 20px 0 16px; font-size: clamp(2.2rem, 7vw, 4.4rem); letter-spacing: -.06em; line-height: 1.02 }
      p { max-width: 550px; margin: 0; color: var(--muted); font-size: 1.05rem; line-height: 1.7 }
      .back { display: inline-flex; align-items: center; margin-top: 30px; padding: 11px 15px; border: 1px solid var(--line); border-radius: 10px; color: #dce4fa; background: rgba(17, 24, 44, .7); font-size: .9rem; font-weight: 700; text-decoration: none; transition: transform .2s, background .2s }
      .back:hover { transform: translateY(-2px); background: rgba(36, 49, 84, .8) }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="index.html"><span class="brand-mark"><img src="images/nuviotr.svg" alt="NuvioTR logosu"></span>NuvioTR</a>
      <section>
        <div class="eyebrow"><span class="dot"></span> Android TV</div>
        <h1>NuvioTR Android TV Uygulaması</h1>
        <p>Android TV deneyimi için hazırlanan NuvioTR uygulamasıyla ilgili güncellemeler ve indirme bilgileri yakında burada paylaşılacak.</p>
        <a class="back" href="index.html">← NuvioTR ana sayfasına dön</a>
      </section>
    </main>
  </body>
</html>
